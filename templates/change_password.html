{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
{% if done %}
<p>Your password has been changed. All sessions have been signed out, including this one.</p>
<p><a href="{{ url_for('login') }}">Log in with your new password</a></p>
{% else %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password
    <input name="current" type="password" autocomplete="current-password" required>
  </label>
  <label>New password (at least 15 characters)
    <input name="new" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
  </label>
  <button type="submit">Change password</button>
</form>
<p><a href="{{ url_for('profile') }}">Cancel</a></p>
{% endif %}
{% endblock %}
